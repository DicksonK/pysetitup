name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  commitizen-check:
    name: Check Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Check commits
        run: |
          cz check --rev-range origin/${{ github.base_ref }}..HEAD

  pr-title:
    name: Check PR Title
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            starts with an uppercase character.

  pr-size:
    name: Check PR Size
    runs-on: ubuntu-latest

    steps:
      - name: Check PR size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const changes = additions + deletions;

            const sizeLabel = changes < 100 ? 'size/XS' :
                             changes < 300 ? 'size/S' :
                             changes < 500 ? 'size/M' :
                             changes < 1000 ? 'size/L' : 'size/XL';

            // Add size label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: [sizeLabel]
            });

            // Warn if PR is too large
            if (changes > 1000) {
              core.warning(`This PR has ${changes} changes. Consider breaking it into smaller PRs.`);
            }

  code-review:
    name: Automated Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for TODO/FIXME comments
        run: |
          echo "## TODO/FIXME Comments" >> $GITHUB_STEP_SUMMARY
          if git diff origin/${{ github.base_ref }}...HEAD | grep -E '^\+.*\b(TODO|FIXME|XXX|HACK)\b'; then
            echo "⚠️ Found new TODO/FIXME comments in this PR" >> $GITHUB_STEP_SUMMARY
            echo "Please ensure these are tracked or resolved before merging." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No new TODO/FIXME comments found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for debug statements
        run: |
          echo "## Debug Statements" >> $GITHUB_STEP_SUMMARY
          if git diff origin/${{ github.base_ref }}...HEAD | grep -E '^\+.*(print\(|console\.log|debugger|import pdb)'; then
            echo "⚠️ Found potential debug statements in this PR" >> $GITHUB_STEP_SUMMARY
            echo "Please review and remove before merging." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No debug statements found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for large files
        run: |
          echo "## Large Files Check" >> $GITHUB_STEP_SUMMARY
          large_files=$(git diff --stat origin/${{ github.base_ref }}...HEAD | grep -E '\|.*\+{10,}' || true)
          if [ -n "$large_files" ]; then
            echo "⚠️ Found files with significant changes:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$large_files" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No unusually large file changes" >> $GITHUB_STEP_SUMMARY
          fi

  test-coverage:
    name: Test Coverage Report
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest tests/unit/ -v --cov=pysetitup --cov-report=term --cov-report=html

      - name: Coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 70
          MINIMUM_ORANGE: 50
